# YOLOv8 PAN chuan nhung CHI 2 detection head (P4/P5) — bo nhanh P3, KHONG co SGC.
# Muc dich: tach loi ich do "bot head" voi loi ich do "SGC" khi so voi YOLOv8s-SGC-P45.
nc: 4
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]   # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11  cat P4
  - [-1, 3, C2f, [512]]                        # 12  (P4/16 out)
  - [-1, 1, Conv, [512, 3, 2]]                 # 13
  - [[-1, 9], 1, Concat, [1]]                  # 14  cat P5
  - [-1, 3, C2f, [1024]]                       # 15  (P5/32 out)
  - [[12, 15], 1, Detect, [nc]]                # 16  <- CHI 2 head: P4, P5
