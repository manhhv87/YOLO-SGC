# YOLOv8 + BiFPN neck (weighted fusion) — baseline canh tranh cho Bang 1.
# Giong PAN chuan cua YOLOv8, chi thay Concat -> BiFPN_Concat2 (fast-normalized weighted concat).
nc: 4
scales:   # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]   # 10
  - [[-1, 6], 1, BiFPN_Concat2, [1]]           # 11  <- weighted cat P4
  - [-1, 3, C2f, [512]]                        # 12
  - [-1, 1, nn.Upsample, [None, 2, nearest]]   # 13
  - [[-1, 4], 1, BiFPN_Concat2, [1]]           # 14  <- weighted cat P3
  - [-1, 3, C2f, [256]]                        # 15  (P3/8 out)
  - [-1, 1, Conv, [256, 3, 2]]                 # 16
  - [[-1, 12], 1, BiFPN_Concat2, [1]]          # 17  <- weighted cat P4-head
  - [-1, 3, C2f, [512]]                        # 18  (P4/16 out)
  - [-1, 1, Conv, [512, 3, 2]]                 # 19
  - [[-1, 9], 1, BiFPN_Concat2, [1]]           # 20  <- weighted cat P5
  - [-1, 3, C2f, [1024]]                       # 21  (P5/32 out)
  - [[15, 18, 21], 1, Detect, [nc]]            # 22
